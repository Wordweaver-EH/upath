services:
  backend:
    build:
      context: ./upath-backend
    ports:
      - "3001:3001"
    env_file:
      - ./upath-backend/.env
    environment:
      - NODE_ENV=production
      - PORT=3001

  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_BACKEND_URL=http://localhost:3001
    depends_on:
      - backend
