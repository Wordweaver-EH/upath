version: '3.8'
services:
  backend:
    build:
      context: ./upath-backend
    ports:
      - "3001:3001"
    env_file:
      - ./upath-backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - CORS_ORIGINS=http://localhost:5173,http://frontend:5173

  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # REACT_APP_BACKEND_URL is embedded in the browser bundle - use localhost for local dev.
      # For remote deployments, override with the actual server hostname.
      - REACT_APP_BACKEND_URL=http://localhost:3001
    depends_on:
      - backend
    stdin_open: true
    tty: true
